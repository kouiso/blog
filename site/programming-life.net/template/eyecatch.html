<!DOCTYPE html>
<!--
  eyecatch.html — アイキャッチ生成テンプレ（1200×630 PNG）
  blog-eyecatch skill が {{TITLE}} / {{CATEGORY}} を置き換えて Playwright(Chromium) で
  viewport 1200x630 のスクショを撮り、<slug>.png として wp_upload_media する。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2563a8 55%, #3178c6 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px; color: #fff; position: relative; overflow: hidden;
  }
  body::after {
    content: ""; position: absolute; right: -140px; bottom: -140px;
    width: 420px; height: 420px; border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .badge {
    display: inline-block; align-self: flex-start;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
    border-radius: 999px; padding: 8px 24px; font-size: 26px; font-weight: 700;
    letter-spacing: .05em; margin-bottom: 40px;
  }
  h1 {
    font-size: 58px; font-weight: 800; line-height: 1.35;
    letter-spacing: .02em; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .site {
    position: absolute; left: 80px; bottom: 56px;
    font-size: 26px; font-weight: 700; letter-spacing: .08em; opacity: .85;
  }
</style>
</head>
<body>
  <span class="badge">{{CATEGORY}}</span>
  <h1>{{TITLE}}</h1>
  <span class="site">programming-life.net</span>
</body>
</html>
