# コードの差分から鍵のようなものを探す（kouiso/blog#14 の項目7）
# issue・PR・コメントの本文は見ない（それは項目1の役目）。
# gitleaks は版と sha256 を固定して公式の配布物を直接使う（有料のキーが要る gitleaks-action は使わない）。
# 規則は gitleaks の既定に固定し、PR が足した .gitleaks.toml / .gitleaksignore では緩められないようにする。
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks を入れる（sha256 を照合）と、固定の設定を置く
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          mkdir -p "$RUNNER_TEMP/no-ignore"
          # 検査の呼び方を1か所にまとめる（自己検査と本番で同じ呼び方を使う）
          cat > "$RUNNER_TEMP/scan.sh" <<'SH'
          #!/usr/bin/env bash
          # 使い方: scan.sh <リポジトリ> <git log の範囲>
          set -euo pipefail
          exec "$RUNNER_TEMP/gitleaks" git "$1" --no-banner --redact \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" \
            --log-opts="-m --first-parent $2"
          SH
          chmod +x "$RUNNER_TEMP/scan.sh"
      - name: 検査が効くことを確かめる（その場で作った偽の鍵の commit で赤になる）
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/selftest"
          git init -q "$d"
          git -C "$d" -c user.name=t -c user.email=t@example.invalid commit -q --allow-empty -m base
          # 偽の GitHub トークン形の文字列をその場で作る（リポジトリには置かない）
          s=""
          while [ "${#s}" -lt 36 ]; do s="$s$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9')"; done
          printf 'token = "ghp_%s"\n' "${s:0:36}" > "$d/leak.txt"
          # 規則を緩める設定を置いても効かないことも確かめる
          printf '[allowlist]\npaths = [".*"]\n' > "$d/.gitleaks.toml"
          git -C "$d" add -A
          git -C "$d" -c user.name=t -c user.email=t@example.invalid commit -q -m leak
          if "$RUNNER_TEMP/scan.sh" "$d" "HEAD~1..HEAD"; then
            echo "::error::偽の鍵を見つけられませんでした"; exit 1
          fi
          echo "偽の鍵で赤になることを確認"
      - name: 差分を検査する
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif printf '%s' "$PUSH_BEFORE" | grep -qE '^[0-9a-f]{40}$' \
            && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # 新しい枝・force push で前の commit が無い時は、全部の履歴を見る
            range="${PUSH_AFTER}"
          fi
          echo "検査する範囲: $range"
          # 検査を緩める変更そのものを止める
          if git diff --name-only "${range%%..*}" "${range##*..}" 2>/dev/null | grep -E '(^|/)\.gitleaks' >/dev/null; then
            echo "::error::.gitleaks の設定ファイルの追加・変更は受け付けません"; exit 1
          fi
          # この workflow 自身は印の文字列を含むので除く（workflow を変える PR はレビューで見る）
          if git log -p -m --first-parent --format= $range -- . ':!.github/workflows/secret-scan.yml' \
            | grep -E '^\+.*gitleaks:allow' >/dev/null; then
            echo "::error::差分に gitleaks:allow があります。検査を外す印は使わないでください"; exit 1
          fi
          "$RUNNER_TEMP/scan.sh" . "$range"
