# コードの差分から鍵のようなものを探す（kouiso/blog#14 の項目7）
# issue・PR・コメントの本文は見ない（それは項目1の役目）。
# gitleaks は版と sha256 を固定して公式の配布物を直接使う（有料のキーが要る gitleaks-action は使わない）。
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks を入れる（sha256 を照合）
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: 検査が効くことを確かめる（その場で作った偽の鍵で赤になる）
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/selftest"
          mkdir -p "$d"
          # 偽の GitHub トークン形の文字列をその場で作る（リポジトリには置かない）
          printf 'token = "ghp_%s"\n' "$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > "$d/leak.txt"
          if "$RUNNER_TEMP/gitleaks" dir "$d" --no-banner --redact; then
            echo "::error::偽の鍵を見つけられませんでした"; exit 1
          fi
          echo "偽の鍵で赤になることを確認"
      - name: 差分を検査する
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "検査する範囲: $range"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --log-opts="$range"
