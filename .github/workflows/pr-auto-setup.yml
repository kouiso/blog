# PR が開かれたときの自動設定（kouiso/blog#14 の項目5・6）
# pull_request_target で動くが、取り出すのは既定のブランチのコードだけで、PR のコードは実行しない。
name: pr-auto-setup
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # ubuntu-latest に入っている Node（20 以上、fetch あり）をそのまま使う
      - name: 作った人を担当者にする
        # 失敗しても後ろの段（ラベル付け）は続ける
        continue-on-error: true
        run: node script/gh/assign-pr-author.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
