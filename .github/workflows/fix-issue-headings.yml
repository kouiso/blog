# issue が作られた直後に見出しを1段浅くする（kouiso/blog#14 の項目3）
name: fix-issue-headings
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # ubuntu-latest に入っている Node（20 以上、fetch あり）をそのまま使う
      - run: node script/gh/fix-issue-headings.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
