# issue が作られた直後に見出しを1段浅くする（kouiso/blog#14 の項目3）
name: fix-issue-headings
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # ubuntu-latest に入っている Node（20 以上、fetch あり）をそのまま使う
      - run: node script/gh/fix-issue-headings.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
